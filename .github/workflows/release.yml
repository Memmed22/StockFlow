name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & publish (same script used for manual releases)
        run: ./publish.sh "${{ steps.version.outputs.version }}"

      - name: Zip publish output
        run: |
          cd publish
          zip -rq "../StockFlow-${{ steps.version.outputs.version }}-win-x64.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StockFlow ${{ github.ref_name }}
          generate_release_notes: true
          files: StockFlow-${{ steps.version.outputs.version }}-win-x64.zip
